<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>SOS HELI — Contrôles Matériel</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0f172a; --card:#1e293b; --card2:#243449; --line:#334155;
  --txt:#e2e8f0; --muted:#94a3b8; --ok:#22c55e; --warn:#f97316; --bad:#ef4444; --dim:#64748b;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
body{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.wrap{max-width:640px;margin:0 auto;padding:0 12px}
header{position:sticky;top:0;z-index:20;background:rgba(15,23,42,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 0 8px}
header .hrow{display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1;line-height:1.2}
header h1 small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.pill{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:#14532d}
.pill.err{color:var(--bad);border-color:#7f1d1d}
.pill.warn{color:var(--warn);border-color:#7c2d12}
#stats{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.stat{flex:1;min-width:88px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center;cursor:pointer;border-width:2px}
.stat .n{font-size:20px;font-weight:700}
.stat .l{font-size:11px;color:var(--muted)}
.stat.on{border-color:#38bdf8;background:var(--card2)}
.stat.k-retard .n{color:var(--bad)} .stat.k-prevoir .n{color:var(--warn)}
.stat.k-ok .n{color:var(--ok)} .stat.k-hs .n{color:var(--bad)}
.stat.k-sans .n{color:var(--dim)}
.bar{display:flex;gap:6px;margin:8px 0;align-items:center}
#q{flex:1;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 12px;font-size:16px}
select{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px;font-size:14px;max-width:46%}
.sech{display:flex;align-items:center;gap:8px;margin:16px 0 6px;cursor:pointer;user-select:none}
.sech h3{margin:0;font-size:14px;color:#7dd3fc;flex:0 1 auto}
.sech .cnt{font-size:11px;color:var(--muted)}
.sech .tri{margin-left:auto;font-size:12px;color:var(--dim)}
.item{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--dim);border-radius:12px;padding:10px 12px;margin:6px 0;display:flex;gap:10px;align-items:center}
.item.k-retard{border-left-color:var(--bad)} .item.k-prevoir{border-left-color:var(--warn)}
.item.k-ok{border-left-color:var(--ok)} .item.k-hs{border-left-color:#7f1d1d}
.item .txt{flex:1;min-width:0;cursor:pointer}
.item .mat{font-size:14px;font-weight:600;overflow-wrap:break-word}
.item .meta{font-size:12px;color:var(--muted);margin-top:2px}
.item .jr{font-size:12px;font-weight:700;text-align:right;white-space:nowrap}
.jr.neg{color:var(--bad)} .jr.soon{color:var(--warn)} .jr.far{color:var(--ok)}
.btn{background:#334155;border:none;color:var(--txt);border-radius:10px;padding:10px 14px;font-size:14px;cursor:pointer}
.btn.pri{background:#0ea5e9;font-weight:700}
.btn.go{background:var(--ok);font-weight:700;color:#052e16}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.btn.danger{background:#7f1d1d}
.btn.big{width:100%;padding:13px;font-size:16px}
.chkbtn{flex:0 0 auto;width:44px;height:44px;border-radius:12px;border:none;background:#14532d;color:#bbf7d0;font-size:19px;cursor:pointer}
#addBtn{position:fixed;right:calc(16px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:#0ea5e9;color:#04202e;font-size:26px;border:none;font-weight:700;z-index:15;box-shadow:0 4px 14px rgba(0,0,0,.5)}
#backupCard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:18px 0}
#backupCard .syncline{font-size:12px;color:var(--muted);margin:4px 0 10px}
#backupCard details{margin-top:10px}
#backupCard summary{cursor:pointer;font-size:13px;color:var(--muted)}
label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
input.f,textarea.f{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px;font-size:16px}
.frow{display:flex;gap:8px}.frow>*{flex:1}
#sheet{position:fixed;inset:0;background:rgba(2,6,23,.65);z-index:30;display:none}
#sheet.open{display:block}
#sheetBox{position:absolute;left:0;right:0;bottom:0;max-height:92dvh;overflow-y:auto;background:var(--bg);border-radius:18px 18px 0 0;border-top:1px solid var(--line);padding:14px 16px calc(18px + env(safe-area-inset-bottom))}
#sheetBox h2{margin:0 0 4px;font-size:16px}
#sheetBox .close{position:absolute;top:10px;right:12px}
#preview{font-size:13px;background:var(--card);border-radius:10px;padding:8px 10px;margin:10px 0}
.hist{font-size:12px;color:var(--muted);margin:2px 0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:#0b1222;border:1px solid var(--line);color:var(--txt);padding:11px 16px;border-radius:12px;font-size:14px;z-index:50;display:none;max-width:92%;box-shadow:0 6px 18px rgba(0,0,0,.5)}
#toast button{margin-left:10px;background:#0ea5e9;border:none;border-radius:8px;padding:5px 10px;color:#04202e;font-weight:700;font-size:13px}
#empty{color:var(--muted);text-align:center;padding:26px 0;font-size:14px}
.empty-sec{display:none}
</style>
</head>
<body>
<header><div class="wrap"><div class="hrow">
<h1>🚁 SOS HELI — Contrôles Matériel<small id="hSub">Registre des contrôles périodiques</small></h1>
<span class="pill" id="drivePill">☁️ —</span>
</div></div></header>
<main class="wrap">
  <div id="stats"></div>
  <div class="bar">
    <input id="q" type="search" placeholder="🔍 Rechercher un matériel…">
    <select id="secSel"><option value="">Toutes sections</option></select>
  </div>
  <div id="list"></div>
  <div id="backupCard"></div>
</main>
<button id="addBtn" onclick="openItem(null)">＋</button>
<div id="sheet" onclick="if(event.target.id==='sheet')closeSheet()">
  <div id="sheetBox">
    <button class="btn ghost close" onclick="closeSheet()">✕</button>
    <h2 id="shTitle">Matériel</h2>
    <div id="preview"></div>
    <label class="f">Section</label><input class="f" id="fSec" list="secList"><datalist id="secList"></datalist>
    <label class="f">Matériel / élément *</label><input class="f" id="fMat">
    <label class="f">Responsable</label><input class="f" id="fResp">
    <div class="frow">
      <div><label class="f">Périodicité (mois)</label><input class="f" id="fPer" type="number" min="1" step="1" inputmode="numeric"></div>
      <div><label class="f">Seuil d'alerte</label><select class="f" id="fA5"><option value="">60 jours (2 mois)</option><option value="1">5 jours</option></select></div>
    </div>
    <div class="frow">
      <div><label class="f">Dernier contrôle</label><input class="f" id="fLast" type="date"></div>
      <div><label class="f">Date limite / péremption</label><input class="f" id="fLim" type="date"></div>
    </div>
    <label class="f"><input type="checkbox" id="fHs" style="vertical-align:middle"> 🔴 Hors service / Réformé</label>
    <label class="f">Observation / notes</label><textarea class="f" id="fNotes" rows="2"></textarea>
    <label class="f">Référence dossier</label><input class="f" id="fRef">
    <div style="height:12px"></div>
    <button class="btn go big" onclick="saveItem()">💾 Enregistrer</button>
    <div style="height:8px"></div>
    <button class="btn ghost big" id="delBtn" onclick="deleteItem()">🗑️ Supprimer ce matériel</button>
    <div style="height:16px"></div>
    <div id="ctlZone">
      <h2 style="font-size:15px">✅ Enregistrer un contrôle</h2>
      <label class="f">Date du contrôle</label><input class="f" id="ctlDate" type="date">
      <label class="f">Note (optionnel)</label><input class="f" id="ctlNote">
      <div style="height:8px"></div>
      <button class="btn pri big" onclick="doControle()">✅ Contrôle effectué</button>
      <div style="height:10px"></div>
      <div id="histBox"></div>
    </div>
  </div>
</div>
<div id="toast"></div>

/* ---------------- dates ---------------- */
function today(){
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function addMonthsISO(iso, m){
  var p = iso.split("-"); var y = +p[0], mo = +p[1], da = +p[2];
  var t = (y*12 + (mo-1)) + m; var ny = Math.floor(t/12), nm = (t%12)+1;
  var last = new Date(ny, nm, 0).getDate();
  return ny + "-" + String(nm).padStart(2,"0") + "-" + String(Math.min(da,last)).padStart(2,"0");
}
function daysTo(iso){ return Math.round((Date.parse(iso) - Date.parse(today()))/86400000); }
function fmtDate(iso){
  if(!iso) return "—";
  var m = {1:"janv",2:"févr",3:"mars",4:"avr",5:"mai",6:"juin",7:"juil",8:"août",9:"sept",10:"oct",11:"nov",12:"déc"};
  var p = iso.split("-");
  return (+p[2]) + " " + m[+p[1]] + " " + p[0];
}

/* ---------------- calcul (formules du registre Excel) ---------------- */
function nextOf(it){
  if(it.last && it.per){
    var n = addMonthsISO(it.last, it.per);
    if(it.lim && n > it.lim) return { d:it.lim, capped:true };
    return { d:n, capped:false };
  }
  if(it.lim) return { d:it.lim, capped:false };
  return { d:null, capped:false };
}
var STATUTS = {
  retard:{ e:"🔴", label:"En retard" },
  prevoir:{ e:"🟠", label:"À prévoir" },
  ok:{ e:"🟢", label:"OK" },
  hs:{ e:"🔴", label:"Hors service / Réformé" },
  reviser:{ e:"🟠", label:"À réviser" },
  sans:{ e:"⚪", label:"Sans échéance connue" }
};
function isHs(it){ return !!it.hs || /REFORME|H\.S/i.test(it.notes || ""); }
function statutOf(it){
  if(isHs(it)) return "hs";
  var n = nextOf(it).d;
  if(n){
    var d = daysTo(n);
    if(d < 0) return "retard";
    if(d <= (it.a5 ? 5 : 60)) return "prevoir";
    return "ok";
  }
  var nb = (it.notes || "").trim().toUpperCase();
  if(nb === "A REVISER") return "reviser";
  if(nb === "OK") return "ok";
  return "sans";
}
function jrHtml(it){
  var n = nextOf(it).d; if(!n) return "";
  var d = daysTo(n);
  var cls = d < 0 ? "neg" : (d <= (it.a5?5:60) ? "soon" : "far");
  var t = d < 0 ? ("🔴 " + (-d) + " j de retard") : (d === 0 ? "⏰ aujourd'hui" : "J–" + d);
  return '<div class="jr ' + cls + '">' + t + '<div style="font-weight:400;font-size:10px;color:var(--muted)">' + fmtDate(n) + '</div></div>';
}

var _shadow = {};
function sig(it){ return JSON.stringify([it.sec,it.mat,it.resp,it.per,it.last,it.lim,!!it.a5,isHs(it),it.notes||"",it.ref||"",JSON.stringify(it.hist||[])]); }
function primeShadow(){ _shadow = {}; state.items.forEach(function(it){ _shadow[it.id] = sig(it); }); }
function stampUpdates(){ state.items.forEach(function(it){ if(_shadow[it.id] !== sig(it)) it.u = Date.now(); }); }
function persist(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }

}

function pruneTombs(){
  var cutoff = Date.now() - 180*86400000;
  Object.keys(state.tombs).forEach(function(id){ if(state.tombs[id] < cutoff) delete state.tombs[id]; });
}
function mergeRemote(remote){
  var added=0, changed=0, removed=0;
  if(!remote || !Array.isArray(remote.items)) return { added:0, changed:0, removed:0 };
  var byId = {}; state.items.forEach(function(it){ byId[it.id] = it; });
  remote.items.forEach(function(rit){
    var lit = byId[rit.id];
    if(!lit){ if(!state.tombs[rit.id] || (rit.u||0) > state.tombs[rit.id]){ state.items.push(rit); added++; } return; }
    if((rit.u||0) > (lit.u||0)){ lit.sec=rit.sec; lit.mat=rit.mat; lit.resp=rit.resp; lit.per=rit.per; lit.last=rit.last; lit.lim=rit.lim; lit.a5=rit.a5; lit.hs=rit.hs; lit.notes=rit.notes; lit.ref=rit.ref; lit.hist=rit.hist||[]; lit.u=rit.u; changed++; }
  });
  var rtombs = remote.tombs || {};
  state.items = state.items.filter(function(it){
    if(rtombs[it.id] && rtombs[it.id] > (it.u||0)){ removed++; return false; }
    return true;
  });
  Object.keys(rtombs).forEach(function(id){ if(rtombs[id] > (state.tombs[id]||0)) state.tombs[id] = rtombs[id]; });
  pruneTombs();
  return { added:added, changed:changed, removed:removed };
}

  return state.items.filter(function(it){
    if(f !== "all"){
      var k = statutOf(it);
      if(f === "prevoir" && k !== "prevoir" && k !== "reviser") return false;
      if(f !== "prevoir" && k !== f) return false;
    }
    if(sf && it.sec !== sf) return false;
    if(q && (it.mat||"").toLowerCase().indexOf(q) < 0 && (it.notes||"").toLowerCase().indexOf(q) < 0 && (it.resp||"").toLowerCase().indexOf(q) < 0 && (it.sec||"").toLowerCase().indexOf(q) < 0) return false;

  });
}

}
var _undo = null;
function undoLast(){
  if(!_undo) return;
  if(_undo.type === "check"){
    var it = getIt(_undo.id);
    if(it){ it.last = _undo.last; it.hist = _undo.hist; save(); }
  } else if(_undo.type === "del"){
    delete state.tombs[_undo.item.id];
    state.items.push(_undo.item); save();
  }
  _undo = null; renderAll();
}

/* ---------------- item sheet ---------------- */
var openId = null;
function getIt(id){ for(var i=0;i<state.items.length;i++) if(state.items[i].id===id) return state.items[i]; return null; }
function uid(){ return "u" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function openItem(id){
  openId = id;
  var it = id ? getIt(id) : null;
  E("shTitle").textContent = it ? (it.mat || "Matériel") : "➕ Nouveau matériel";
  E("fSec").value = it ? (it.sec||"") : (state.cfg.secFilter || sections()[0] || "");
  E("fMat").value = it ? (it.mat||"") : "";
  E("fResp").value = it ? (it.resp||"") : "";
  E("fPer").value = it && it.per ? it.per : "";
  E("fA5").value = it && it.a5 ? "1" : "";
  E("fLast").value = it ? (it.last||"") : "";
  E("fLim").value = it ? (it.lim||"") : "";
  E("fHs").checked = it ? isHs(it) : false;
  E("fNotes").value = it ? (it.notes||"") : "";
  E("fRef").value = it ? (it.ref||"") : "";
  E("delBtn").style.display = it ? "block" : "none";
  E("ctlZone").style.display = it ? "block" : "none";
  E("ctlDate").value = today();
  E("ctlNote").value = "";
  renderHist(it);
  refreshPreview();
  E("sheet").classList.add("open");
}
function closeSheet(){ E("sheet").classList.remove("open"); openId = null; }
function readForm(){
  return {
    sec: E("fSec").value.trim() || "(sans section)",
    mat: E("fMat").value.trim(),
    resp: E("fResp").value.trim() || null,
    per: E("fPer").value ? Math.max(1, Math.round(+E("fPer").value)) : null,
    last: E("fLast").value || null,
    lim: E("fLim").value || null,
    a5: !!E("fA5").value,
    hs: E("fHs").checked,
    notes: E("fNotes").value.trim() || null,
    ref: E("fRef").value.trim() || null
  };
}
function refreshPreview(){
  var f = readForm();
  var probe = { id:openId||"probe", sec:f.sec, mat:f.mat, resp:f.resp, per:f.per, last:f.last, lim:f.lim, a5:f.a5, hs:f.hs, notes:f.notes, ref:f.ref, hist:[] };
  var k = statutOf(probe), n = nextOf(probe);
  E("preview").innerHTML = STATUTS[k].e + " <b>" + STATUTS[k].label + "</b>"
    + (n.d ? " · prochain contrôle : <b>" + fmtDate(n.d) + "</b>" + (n.capped ? " (plafonné à la date limite)" : "") + " · " + (daysTo(n.d) < 0 ? "🔴 " + (-daysTo(n.d)) + " j de retard" : "J–" + daysTo(n.d)) : " · aucune échéance calculable");
}
function saveItem(){
  var f = readForm();
  if(!f.mat){ toast("⚠️ Le nom du matériel est obligatoire"); return; }
  if(f.last && f.lim && f.lim < f.last){ toast("⚠️ La date limite est avant le dernier contrôle"); return; }
  if(openId){
    var it = getIt(openId);
    if(!it){ closeSheet(); return; }
    it.sec=f.sec; it.mat=f.mat; it.resp=f.resp; it.per=f.per; it.last=f.last; it.lim=f.lim;
    it.a5=f.a5; it.hs=f.hs; it.notes=f.notes; it.ref=f.ref;
  } else {
    state.items.push({ id:uid(), num:null, sec:f.sec, mat:f.mat, resp:f.resp, per:f.per, last:f.last, lim:f.lim, a5:f.a5, hs:f.hs, notes:f.notes, ref:f.ref, hist:[], u:Date.now() });
  }
  save(); renderAll(); closeSheet();
  toast("💾 Matériel enregistré");
}
function renderHist(it){
  var h = (it && it.hist && it.hist.length) ? it.hist.slice().reverse() : [];
  E("histBox").innerHTML = h.length ? "<b style='font-size:13px'>🕘 Historique</b>" + h.map(function(e){
    return '<div class="hist">✔ ' + fmtDate(e.d) + (e.n ? " — " + esc(e.n) : "") + '</div>';
  }).join("") : "";
}
function doControle(){
  var it = getIt(openId); if(!it) return;
  var d = E("ctlDate").value || today();
  var n = E("ctlNote").value.trim();
  _undo = { type:"check", id:it.id, last:it.last, hist:JSON.parse(JSON.stringify(it.hist||[])) };
  it.last = d;
  if(!it.hist) it.hist = [];
  it.hist.push({ d:d, n:n });
  if(!it.per && !it.lim) toast("✅ Contrôle du " + fmtDate(d) + " enregistré — ⚠️ sans périodicité, aucun prochain contrôle n'est calculé", "Annuler", undoLast);
  else toast("✅ Contrôle du " + fmtDate(d) + " enregistré", "Annuler", undoLast);
  save(); renderAll(); openItem(it.id); E("ctlDate").value = today(); E("ctlNote").value = "";
}
function quickCheck(id){
  var it = getIt(id); if(!it) return;
  _undo = { type:"check", id:it.id, last:it.last, hist:JSON.parse(JSON.stringify(it.hist||[])) };
  it.last = today();
  if(!it.hist) it.hist = [];
  it.hist.push({ d:today(), n:"" });
  save(); renderAll();
  toast("✅ " + it.mat + " contrôlé aujourd'hui", "Annuler", undoLast);
}
function deleteItem(){
  var it = getIt(openId); if(!it) return;
  if(!window.confirm("Supprimer « " + (it.mat||"") + " » ?")) return;
  state.tombs[it.id] = Date.now();
  state.items = state.items.filter(function(x){ return x.id !== it.id; });
  _undo = { type:"del", item:JSON.parse(JSON.stringify(it)) };
  save(); renderAll(); closeSheet();
  toast("🗑️ Matériel supprimé", "Annuler", undoLast);
}

/* ---------------- export / import ---------------- */
function exportData(){ return JSON.stringify({ v:1, app:"sos-heli-controles", exported:new Date().toISOString(), items:state.items, tombs:state.tombs }); }
function download(name, content, mime){
  var blob = new Blob([content], { type:mime||"application/octet-stream" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 800);
}
function exportFile(){ download("sos-heli-controles-" + today() + ".json", exportData(), "application/json"); }
function exportCsv(){
  var head = ["N°","SECTION","MATÉRIEL / ÉLÉMENT","RESPONSABLE","PÉRIODICITÉ (MOIS)","DATE DERNIER CONTRÔLE","DATE LIMITE","PROCHAIN CONTRÔLE","JOURS RESTANTS","STATUT","OBSERVATION / NOTES","RÉFÉRENCE DOSSIER"];
  function q(v){ return '"' + String(v==null?"":v).replace(/"/g,'""') + '"'; }
  var rows = [head.map(q).join(";")];
  state.items.forEach(function(it){
    var n = nextOf(it).d, k = statutOf(it);
    rows.push([it.num==null?"":it.num, it.sec, it.mat, it.resp||"", it.per==null?"":it.per, it.last||"", it.lim||"", n||"", n?daysTo(n):"", STATUTS[k].e + " " + STATUTS[k].label, it.notes||"", it.ref||""].map(q).join(";"));
  });
  download("suivi-controles-sos-heli-" + today() + ".csv", "\uFEFF" + rows.join("\r\n"), "text/csv");
  toast("📄 CSV exporté — ouvrable dans Excel");
}
function importFile(ev){
  var f = ev.target.files && ev.target.files[0]; if(!f) return;
  var r = new FileReader();
  r.onload = function(){ importJsonText(r.result, true); };
  r.readAsText(f);
}
function importJsonText(txt, force){
  var data;
  try{ data = JSON.parse(txt); }catch(e){ toast("⚠️ Fichier illisible"); return false; }
  if(!data || !Array.isArray(data.items)){ toast("⚠️ Format inconnu"); return false; }
  if(!force && !window.confirm("Remplacer les " + state.items.length + " matériels actuels par les " + data.items.length + " du fichier ?")) return false;
  try{ localStorage.setItem(KEY + "-secours", localStorage.getItem(KEY)); }catch(e){}
  state.items = data.items; state.tombs = data.tombs || {};
  primeShadow(); persist(); renderAll();
  toast("📥 " + data.items.length + " matériels importés");
  return true;
}

/* ---------------- Google Drive ---------------- */
var _tok = null, _tokAt = 0;
function driveCfgOk(){ return !!(state.cfg.dCid && state.cfg.dRefresh); }
function driveToken(){
  if(_tok && (Date.now() - _tokAt) < 50*60000) return Promise.resolve(_tok);
  var body = "client_id=" + encodeURIComponent(state.cfg.dCid)
    + (state.cfg.dSecret ? "&client_secret=" + encodeURIComponent(state.cfg.dSecret) : "")
    + "&refresh_token=" + encodeURIComponent(state.cfg.dRefresh)
    + "&grant_type=refresh_token";
  return fetch("https://oauth2.googleapis.com/token", { method:"POST", headers:{ "Content-Type":"application/x-www-form-urlencoded" }, body:body })
    .then(function(r){ return r.json().then(function(j){
      if(!r.ok || !j.access_token) throw new Error(j.error_description || j.error || "token refusé");
      _tok = j.access_token; _tokAt = Date.now(); return _tok;
    }); });
}
function fetchTO(url, opts, ms){
  var ctl = new AbortController();
  var to = setTimeout(function(){ ctl.abort(); }, ms || 20000);
  var o = Object.assign({}, opts || {});
  o.signal = ctl.signal;
  return fetch(url, o).then(function(r){ clearTimeout(to); return r; }, function(e){ clearTimeout(to); throw e; });
}
function driveApi(path, opts){
  return driveToken().then(function(tok){
    var o = Object.assign({}, opts || {});
    o.headers = Object.assign({}, o.headers || {}, { Authorization:"Bearer " + tok });
    return fetchTO("https://www.googleapis.com/" + path, o);
  });
}
function driveFind(name, mime, parent){
  var q = "name='" + name.replace(/'/g,"\\'") + "' and mimeType='" + mime + "' and trashed=false"
    + (parent ? " and '" + parent + "' in parents" : "");
  return driveApi("drive/v3/files?q=" + encodeURIComponent(q) + "&fields=files(id,name)&pageSize=5")
    .then(function(r){ return r.json(); })
    .then(function(j){ return (j.files && j.files[0]) ? j.files[0].id : null; });
}
function driveCreateFolder(name){
  return driveApi("drive/v3/files?fields=id", { method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ name:name, mimeType:"application/vnd.google-apps.folder", fields:"id" }) })
    .then(function(r){ return r.json(); }).then(function(j){ if(!j.id) throw new Error("dossier non créé"); return j.id; });
}
function driveFolderId(){
  return driveFind(state.cfg.dFolder || "taffbmpm", "application/vnd.google-apps.folder")
    .then(function(id){ return id || driveCreateFolder(state.cfg.dFolder || "taffbmpm"); });
}
function driveFileId(folderId){
  return driveFind("sos-heli-controles.json", "application/json", folderId);
}
function driveDownload(fileId){
  return driveApi("drive/v3/files/" + fileId + "?alt=media").then(function(r){ return r.text(); });
}
function driveUploadCreate(folderId, text){
  var meta = JSON.stringify({ name:"sos-heli-controles.json", parents:[folderId] });
  var body = "--sosb\nContent-Type: application/json; charset=UTF-8\n\n" + meta + "\n--sosb\nContent-Type: application/json\n\n" + text + "\n--sosb--";
  return driveApi("upload/drive/v3/files?uploadType=multipart&fields=id", { method:"POST", headers:{ "Content-Type":"multipart/related; boundary=sosb" }, body:body })
    .then(function(r){ return r.json(); });
}
function driveUploadUpdate(fileId, text){
  return driveApi("upload/drive/v3/files/" + fileId + "?uploadType=media&fields=id", { method:"PATCH", headers:{ "Content-Type":"application/json" }, body:text })
    .then(function(r){ return r.json(); });
}
function driveSend(manual){
  if(!driveCfgOk()){
    if(manual) toast("⚙️ Configure le Drive dans les options ci-dessous");
    return Promise.resolve();
  }
  if(driveSending){
    if(Date.now() - driveSendingAt < 120000){
      if(manual) toast("☁️ Envoi déjà en cours — celui-ci repartira juste après");
      _saveSeq++; _dirty = true; return Promise.resolve();
    }
    if(manual) toast("⚠️ Un envoi semblait bloqué — nouvelle tentative");
  }
  driveSending = true; driveSendingAt = Date.now();
  var seq0 = _saveSeq;
  var myLock = driveSendingAt;
  return driveFolderId()
    .then(function(fid){ return driveFileId(fid).then(function(fileId){
      var up = function(text){
        var f = fileId ? driveUploadUpdate(fileId, text) : driveUploadCreate(fid, text);
        return f.then(function(j){
          if(!j.id) throw new Error("upload refusé");
          state.driveSyncedAt = Date.now();
          _dirty = _saveSeq > seq0;
          persist(); renderPill(); renderBackupCard();
          if(manual) toast("☁️ Sauvegardé sur Drive" + (_dirty ? " (d’autres changements repartiront)" : ""));
        });
      };
      if(!fileId) return up(JSON.stringify({ v:1, app:"sos-heli-controles", items:state.items, tombs:state.tombs }));
      return driveDownload(fileId).then(function(txt){
        var remote = null;
        try{ remote = JSON.parse(txt); }catch(e){}
        var m = mergeRemote(remote);
        if(m.added || m.changed || m.removed){ persist(); renderAll(); }
        if(manual && (m.added || m.changed || m.removed))
          toast("☁️ Fusion : +" + m.added + " ~" + m.changed + " −" + m.removed);
        return up(JSON.stringify({ v:1, app:"sos-heli-controles", items:state.items, tombs:state.tombs }));
      }, function(){ return up(JSON.stringify({ v:1, app:"sos-heli-controles", items:state.items, tombs:state.tombs })); });
    }); })
    .catch(function(e){
      if(manual) toast("⚠️ Sauvegarde Drive impossible : " + (e && e.message ? e.message : "réseau"));
    })
    .then(function(){ if(driveSendingAt === myLock){ driveSending = false; } });
}
function driveRestore(){
  if(!driveCfgOk()){ toast("⚙️ Configure le Drive d’abord"); return; }
  driveFolderId().then(function(fid){
    return driveFileId(fid).then(function(fileId){
      if(!fileId) throw new Error("aucune sauvegarde trouvée");
      return driveDownload(fileId);
    });
  }).then(function(txt){
    importJsonText(txt, false);
  }).catch(function(e){ toast("⚠️ Restauration impossible : " + (e && e.message ? e.message : "réseau")); });
}
function saveDriveCfg(){
  state.cfg.dCid = E("dCid").value.trim();
  state.cfg.dSecret = E("dSecret").value.trim();
  state.cfg.dRefresh = E("dRefresh").value.trim();
  state.cfg.dFolder = E("dFolder").value.trim() || "taffbmpm";
  persist(); renderBackupCard();
  if(!driveCfgOk()){ toast("⚠️ Client ID et Refresh Token obligatoires"); return; }
  _tok = null; _tokAt = 0;
  driveSend(true);
}
function driveDisconnect(){
  state.cfg.dCid = ""; state.cfg.dSecret = ""; state.cfg.dRefresh = "";
  _tok = null; _tokAt = 0;
  persist(); renderBackupCard(); toast("🔌 Drive déconnecté");
}
function toggleAuto(){ state.cfg.driveAuto = E("dAuto").checked; persist(); }

/* ---------------- recherche / events ---------------- */
function initEvents(){
  E("q").addEventListener("input", function(){
    state.cfg.q = E("q").value; persist(); renderList();
  });
  E("q").value = state.cfg.q || "";
  E("secSel").addEventListener("change", function(){
    state.cfg.secFilter = E("secSel").value; persist(); renderList();
  });
  document.addEventListener("visibilitychange", function(){
    if(document.hidden && _dirty && driveCfgOk() && state.cfg.driveAuto) driveSend(false);
  });
}
function boot(){
  load();
  initEvents();
  renderAll();
  if(driveCfgOk() && state.cfg.driveAuto) driveSend(false);
}
boot();
</script>

      if(n) n.addEventListener("statechange", function(){
        if(n.state === "installed" && navigator.serviceWorker.controller) toast("🔄 Nouvelle version installée — recharge la page");
      });
    });
  }).catch(function(){});
}
